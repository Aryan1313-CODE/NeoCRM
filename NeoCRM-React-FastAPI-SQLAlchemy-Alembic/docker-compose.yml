services:
  postgres:
    image: postgres:16-alpine
    container_name: neocrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chemora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - neocrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chemora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: neocrm-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/chemora
      SECRET_KEY: change-this-development-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_USE_MOCK_API: "false"
    container_name: neocrm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  neocrm_postgres_data:
