services:
  postgres:
    image: postgres:16-alpine
    container_name: chemora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chemora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - chemora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chemora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: chemora-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chemora
      JWT_SECRET: change-this-development-secret
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  chemora_postgres_data:
