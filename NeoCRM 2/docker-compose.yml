services:
  postgres:
    image: postgres:16-alpine
    container_name: neocrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chemora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - neocrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chemora"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai
    container_name: neocrm-ai
    restart: unless-stopped
    environment:
      PORT: 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: neocrm-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chemora
      JWT_SECRET: change-this-development-secret
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      AI_SERVICE_URL: http://ai:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_USE_MOCK_API: "false"
    container_name: neocrm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  neocrm_postgres_data: